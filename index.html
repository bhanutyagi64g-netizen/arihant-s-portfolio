<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a1a;--ink:#f5f5f5;--card:#262626;--sh:#f5f5f5}}
:root[data-theme="dark"]{--bg:#1a1a1a;--ink:#f5f5f5;--card:#262626;--sh:#f5f5f5}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;font-size:17px;line-height:1.5}
a{color:inherit}
.wrap{max-width:1050px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:3px solid var(--ink)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;padding-top:12px;padding-bottom:12px;gap:12px;flex-wrap:wrap}
.logo{background:var(--ink);color:var(--bg);padding:2px 10px;font-weight:700;text-decoration:none}
nav ul{display:flex;gap:14px;list-style:none;margin:0;padding:0;font-weight:700;font-size:14px;align-items:center;flex-wrap:wrap}
nav a{text-decoration:none}nav ul a:hover{background:var(--pink);color:#111}
.btn{display:inline-block;border:3px solid var(--ink);background:var(--pink);color:#111;font:700 15px 'Space Grotesk',sans-serif;padding:10px 20px;box-shadow:5px 5px 0 var(--sh);text-decoration:none;cursor:pointer;transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--sh)}
.btn.alt{background:var(--blue)}
#theme{padding:4px 10px;font-size:13px;box-shadow:3px 3px 0 var(--sh)}
.hero{padding:64px 0 48px}
.tag{display:inline-block;background:var(--green);color:#111;border:3px solid var(--ink);padding:2px 12px;font-family:'Space Mono',monospace;font-size:14px;transform:rotate(-2deg);margin-bottom:18px}
h1{font-size:clamp(42px,9vw,92px);line-height:.98;margin:0 0 20px;text-transform:uppercase;letter-spacing:-1px}
h1 mark{background:var(--pink);color:#111;padding:0 8px}
.hero p{max-width:560px;font-size:19px;margin:0 0 28px}
.hero .btns{display:flex;gap:16px;flex-wrap:wrap}
section{padding:48px 0;border-top:3px solid var(--ink)}
h2{font-size:clamp(28px,5vw,44px);text-transform:uppercase;margin:0 0 28px;display:inline-block;background:var(--ink);color:var(--bg);padding:2px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.card{background:var(--card);border:3px solid var(--ink);box-shadow:7px 7px 0 var(--sh);padding:20px;display:flex;flex-direction:column;gap:10px;transition:transform .1s,box-shadow .1s}
.card:hover{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--sh)}
.card h3{margin:0;font-size:22px}
.card p{margin:0;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--ink);padding:2px 10px;font:14px 'Space Mono',monospace;color:#111}
.skills{display:flex;flex-wrap:wrap;gap:12px}
.skills .chip{font-size:16px;padding:6px 16px;box-shadow:4px 4px 0 var(--sh);font-weight:700;font-family:'Space Grotesk',sans-serif}
.about{display:grid;grid-template-columns:2fr 1fr;gap:28px}
@media(max-width:700px){.about{grid-template-columns:1fr}nav ul{gap:8px}}
.stat{background:var(--orange);color:#111;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--sh);padding:16px;margin-bottom:18px}
.stat b{font-size:40px;display:block;line-height:1}
.tl{border-left:4px solid var(--ink);padding-left:20px;display:flex;flex-direction:column;gap:22px;margin-left:6px}
.tl h3{margin:0;font-size:20px}.tl small{font-family:'Space Mono',monospace}
form{display:grid;gap:16px;max-width:560px}
input,textarea{width:100%;border:3px solid var(--ink);background:var(--card);color:var(--ink);padding:12px;font:16px 'Space Grotesk',sans-serif;box-shadow:4px 4px 0 var(--sh)}
input:focus,textarea:focus{outline:none;background:var(--blue);color:#111}
footer{border-top:3px solid var(--ink);padding:24px 0;font-family:'Space Mono',monospace;font-size:14px}
.links{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:28px}
.marquee{background:var(--ink);color:var(--bg);overflow:hidden;white-space:nowrap;padding:8px 0;font-weight:700;text-transform:uppercase}
.marquee span{display:inline-block;animation:m 22s linear infinite}
@keyframes m{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){.marquee span{animation:none}}
.shot{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:top;border:3px solid var(--ink)}
.btn.green{background:var(--green)}
.caret{animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
nav ul a.active{background:var(--pink);color:#111}
#backToTop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;padding:8px 14px;font-size:18px;display:none}
.hero-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:36px;align-items:center}
.avatar{border:3px solid var(--ink);box-shadow:8px 8px 0 var(--sh);background:var(--card);max-width:320px;width:100%;justify-self:center;transform:rotate(3deg);line-height:0}
.avatar svg{display:block;width:100%;height:auto}
.avatar.sm{max-width:200px;margin:0 0 24px;transform:rotate(-3deg)}
@media(max-width:700px){.hero-grid{grid-template-columns:1fr}.avatar{max-width:230px;justify-self:start}}
</style>

$('skillList').innerHTML=DATA.skills.map((s,i)=>`<span class="chip" style="background:var(${cols[i%4]})">${esc(s)}</span>`).join("");
$('projList').innerHTML=DATA.projects.map(p=>`<article class="card">${SHOTS[p.title]?`<img class="shot" src="${SHOTS[p.title]}" alt="${esc(p.title)} screenshot" loading="lazy">`:""}<div class="chips">${p.tech.map(t=>`<span class="chip" style="background:var(${p.color})">${esc(t)}</span>`).join("")}</div><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:auto"><a class="btn alt" href="${esc(p.link)}" target="_blank" rel="noopener">GitHub</a><a class="btn" href="${esc(p.demo[1])}" target="_blank" rel="noopener">${esc(p.demo[0])}</a></div></article>`).join("");
$('tl').innerHTML=DATA.journey.map(j=>`<div><small>${esc(j.when)}</small><h3>${esc(j.title)}</h3><p style="margin:0">${esc(j.text)}</p></div>`).join("");
$('links').innerHTML=DATA.links.map(l=>`<a class="btn" href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}</a>`).join("");
$('form').addEventListener('submit',e=>{e.preventDefault();const f=e.target,n=$('formNote'),b=$('send');if(typeof emailjs==="undefined"){n.textContent="Couldn't load the email service. Please email me directly.";return}b.disabled=true;n.textContent="Sending...";emailjs.sendForm("service_v8gs30h","template_3bqxheh",f).then(()=>{n.textContent="Message sent. Thank you!";f.reset()}).catch(err=>{console.error("EmailJS Error:",err);n.textContent="Failed to send. Please try again or email me directly."}).finally(()=>{b.disabled=false})});
$('theme').addEventListener('click',()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"});
